<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude AI Chat - Multi Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .glass {
            backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass:hover {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .chat-container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 280px;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            background: rgba(15, 23, 42, 0.8);
            overflow-y: auto;
        }

        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
            animation: slideIn 0.3s ease;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.user .content {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 12px 2px 12px 12px;
            max-width: 70%;
        }

        .message.assistant .content {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px 12px 12px 12px;
            max-width: 70%;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .message .content {
            padding: 12px 16px;
            word-wrap: break-word;
            line-height: 1.5;
        }

        .message .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 18px;
        }

        .message.user .avatar {
            order: 2;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        }

        .message.assistant .avatar {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .input-area {
            padding: 20px 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 12px;
        }

        .input-field {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 12px 16px;
            border-radius: 8px;
            resize: none;
            max-height: 100px;
        }

        .input-field:focus {
            outline: none;
            border-color: rgba(59, 130, 246, 0.5);
            background: rgba(255, 255, 255, 0.08);
        }

        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .btn-send {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(59, 130, 246, 0.4);
        }

        .btn-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 10px;
            flex-direction: column;
        }

        .btn-new-chat {
            width: 100%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-new-chat:hover {
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .chats-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .chat-item {
            padding: 12px;
            margin: 6px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid transparent;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 13px;
        }

        .chat-item:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .chat-item.active {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .settings-panel {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .settings-panel label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
        }

        .settings-panel input,
        .settings-panel select {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 12px;
        }

        .settings-panel input:focus,
        .settings-panel select:focus {
            outline: none;
            border-color: rgba(59, 130, 246, 0.5);
            background: rgba(255, 255, 255, 0.08);
        }

        .settings-panel input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .loading {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .loading span {
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .loading span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                opacity: 0.5;
                transform: translateY(0);
            }
            40% {
                opacity: 1;
                transform: translateY(-8px);
            }
        }

        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }

        .welcome-screen h2 {
            font-size: 28px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #60a5fa, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .welcome-screen p {
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 8px;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #ef4444;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .success-message {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.5);
            color: #10b981;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .model-badge {
            display: inline-block;
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 8px;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }

            .message.user .content,
            .message.assistant .content {
                max-width: 90%;
            }

            .input-area {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h1 style="font-size: 20px; font-weight: bold; background: linear-gradient(135deg, #60a5fa, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">
                    <i class="fas fa-brain"></i> Claude AI
                </h1>
                <button class="btn-new-chat" onclick="startNewChat()">
                    <i class="fas fa-plus"></i> New Chat
                </button>
            </div>

            <div class="settings-panel">
                <label>API Key</label>
                <input type="password" id="apiKey" placeholder="sk-ant-..." onchange="saveSettings()">
                
                <label>Model</label>
                <select id="modelSelect" onchange="saveSettings()">
                    <option value="claude-3-5-sonnet-20241022">Claude 3.5 Sonnet</option>
                    <option value="claude-3-opus-20250219">Claude 3 Opus</option>
                    <option value="claude-3-haiku-20240307">Claude 3 Haiku</option>
                </select>

                <label>Temperature</label>
                <input type="range" id="temperature" min="0" max="1" step="0.1" value="0.7" onchange="saveSettings()">
                <span style="font-size: 11px; color: rgba(255,255,255,0.5);" id="tempValue">0.7</span>
            </div>

            <div class="chats-list" id="chatsList"></div>
        </div>

        <!-- Main Chat Area -->
        <div class="chat-main">
            <div class="messages-area" id="messagesArea">
                <div class="welcome-screen">
                    <h2><i class="fas fa-robot"></i> Claude AI Chat</h2>
                    <p>Add your API key and start chatting with Claude</p>
                    <p style="font-size: 12px; margin-top: 20px;">Your API key is stored securely in your browser</p>
                </div>
            </div>

            <div class="input-area">
                <textarea class="input-field" id="messageInput" placeholder="Type your message..." rows="1"></textarea>
                <button class="btn-send" id="sendBtn" onclick="sendMessage()">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Store for conversations
        let conversations = {};
        let currentChatId = null;
        let settings = {
            apiKey: '',
            model: 'claude-3-5-sonnet-20241022',
            temperature: 0.7
        };

        // Load settings and conversations
        function loadData() {
            const savedSettings = localStorage.getItem('claudeSettings');
            if (savedSettings) {
                settings = JSON.parse(savedSettings);
                document.getElementById('apiKey').value = settings.apiKey;
                document.getElementById('modelSelect').value = settings.model;
                document.getElementById('temperature').value = settings.temperature;
                document.getElementById('tempValue').textContent = settings.temperature;
            }

            const savedConversations = localStorage.getItem('claudeConversations');
            if (savedConversations) {
                conversations = JSON.parse(savedConversations);
            }

            renderChatsList();
        }

        // Save settings
        function saveSettings() {
            settings.apiKey = document.getElementById('apiKey').value;
            settings.model = document.getElementById('modelSelect').value;
            settings.temperature = parseFloat(document.getElementById('temperature').value);
            document.getElementById('tempValue').textContent = settings.temperature;
            localStorage.setItem('claudeSettings', JSON.stringify(settings));
        }

        // Save conversations
        function saveConversations() {
            localStorage.setItem('claudeConversations', JSON.stringify(conversations));
        }

        // Start new chat
        function startNewChat() {
            const chatId = 'chat_' + Date.now();
            conversations[chatId] = {
                id: chatId,
                title: 'New Conversation',
                messages: [],
                createdAt: new Date().toLocaleString()
            };
            currentChatId = chatId;
            saveConversations();
            renderChatsList();
            renderMessages();
        }

        // Render chats list
        function renderChatsList() {
            const chatsList = document.getElementById('chatsList');
            chatsList.innerHTML = '';

            Object.keys(conversations).forEach(chatId => {
                const chat = conversations[chatId];
                const chatItem = document.createElement('div');
                chatItem.className = `chat-item ${chatId === currentChatId ? 'active' : ''}`;
                chatItem.textContent = chat.title || 'New Conversation';
                chatItem.onclick = () => {
                    currentChatId = chatId;
                    renderMessages();
                    renderChatsList();
                };
                chatItem.style.position = 'relative';
                
                // Add delete button
                const deleteBtn = document.createElement('span');
                deleteBtn.innerHTML = ' <i class="fas fa-trash" style="cursor: pointer; opacity: 0.5;"></i>';
                deleteBtn.onclick = (e) => {
                    e.stopPropagation();
                    if (confirm('Delete this conversation?')) {
                        delete conversations[chatId];
                        if (currentChatId === chatId) {
                            currentChatId = null;
                            renderMessages();
                        }
                        saveConversations();
                        renderChatsList();
                    }
                };
                
                chatItem.appendChild(deleteBtn);
                chatsList.appendChild(chatItem);
            });

            if (Object.keys(conversations).length === 0 && currentChatId === null) {
                startNewChat();
            }
        }

        // Render messages
        function renderMessages() {
            const messagesArea = document.getElementById('messagesArea');
            messagesArea.innerHTML = '';

            if (!currentChatId || !conversations[currentChatId] || conversations[currentChatId].messages.length === 0) {
                messagesArea.innerHTML = `
                    <div class="welcome-screen">
                        <h2><i class="fas fa-robot"></i> Claude AI Chat</h2>
                        <p>Start a new conversation to chat with Claude</p>
                        <p style="font-size: 12px; margin-top: 20px;">Make sure your API key is set in the left panel</p>
                    </div>
                `;
                return;
            }

            const messages = conversations[currentChatId].messages;
            messages.forEach(msg => {
                const messageEl = document.createElement('div');
                messageEl.className = `message ${msg.role}`;
                messageEl.innerHTML = `
                    <div class="avatar">${msg.role === 'user' ? '👤' : '🤖'}</div>
                    <div class="content">
                        ${msg.content}
                        ${msg.role === 'assistant' ? `<div class="model-badge">${settings.model.split('-')[1]}</div>` : ''}
                    </div>
                `;
                messagesArea.appendChild(messageEl);
            });

            // Scroll to bottom
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        // Send message
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message) return;
            if (!settings.apiKey) {
                alert('Please add your API key in the left panel');
                return;
            }

            if (!currentChatId) {
                startNewChat();
            }

            // Add user message
            conversations[currentChatId].messages.push({
                role: 'user',
                content: message
            });

            input.value = '';
            renderMessages();

            // Show loading
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;

            try {
                // Call Claude API
                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': settings.apiKey,
                        'anthropic-version': '2023-06-01'
                    },
                    body: JSON.stringify({
                        model: settings.model,
                        max_tokens: 1024,
                        temperature: settings.temperature,
                        messages: conversations[currentChatId].messages.map(msg => ({
                            role: msg.role,
                            content: msg.content
                        }))
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error?.message || 'API Error');
                }

                const data = await response.json();
                const assistantMessage = data.content[0].text;

                // Add assistant message
                conversations[currentChatId].messages.push({
                    role: 'assistant',
                    content: assistantMessage
                });

                // Update chat title from first user message
                if (conversations[currentChatId].messages.length === 2) {
                    conversations[currentChatId].title = message.substring(0, 50) + (message.length > 50 ? '...' : '');
                }

                saveConversations();
                renderMessages();
                renderChatsList();

            } catch (error) {
                console.error('Error:', error);
                conversations[currentChatId].messages.pop(); // Remove user message
                alert('Error: ' + error.message);
                renderMessages();
            } finally {
                sendBtn.disabled = false;
                document.getElementById('messageInput').focus();
            }
        }

        // Enter to send
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Temperature slider update
        document.getElementById('temperature').addEventListener('input', (e) => {
            document.getElementById('tempValue').textContent = e.target.value;
            saveSettings();
        });

        // Initialize
        loadData();
    </script>
</body>
</html>
